<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="mranRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="mranShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#dc2626" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background Badge -->
  <circle cx="256" cy="170" r="105" fill="#fef2f2" stroke="#ef4444" stroke-width="2.5" />
  
  <!-- 3 Red Dynamic Velocity Wings (Official MRAN emblem) -->
  <path d="M190,195 C175,170 190,130 220,110 C210,135 200,165 225,195 Z" fill="url(#mranRed)" filter="url(#mranShadow)" />
  <path d="M215,205 C205,175 225,135 255,115 C240,145 235,175 260,205 Z" fill="url(#mranRed)" filter="url(#mranShadow)" />
  <path d="M245,215 C235,185 260,140 295,120 C275,155 270,185 300,215 Z" fill="url(#mranRed)" filter="url(#mranShadow)" />

  <!-- Typography matching official logo -->
  <text x="256" y="325" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="52" font-weight="900" letter-spacing="6" fill="#1e1b4b" text-anchor="middle">MRAN</text>
  <text x="256" y="360" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="800" letter-spacing="5" fill="#dc2626" text-anchor="middle">MRAN SPORTS</text>
  <text x="256" y="394" font-family="'Cairo', system-ui, sans-serif" font-size="22" font-weight="800" fill="#1e293b" text-anchor="middle">مؤسسة مران للاستثمار الرياضي</text>
  <rect x="216" y="408" width="80" height="3" rx="1.5" fill="#dc2626" />
  <text x="256" y="438" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#64748b" text-anchor="middle">A MEMBER OF MRG GROUP</text>
</svg>