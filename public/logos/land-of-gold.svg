<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="goldShine" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect x="156" y="70" width="200" height="200" rx="36" fill="#fffbeb" stroke="#f59e0b" stroke-width="3" />
  
  <!-- Diamond Crest & Royal Ingot -->
  <polygon points="256,95 326,145 256,245 186,145" fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-linejoin="round" filter="url(#goldShine)" />
  <line x1="186" y1="145" x2="326" y2="145" stroke="url(#goldGrad)" stroke-width="6" />
  <line x1="256" y1="95" x2="256" y2="245" stroke="url(#goldGrad)" stroke-width="5" />
  <circle cx="256" cy="145" r="10" fill="#d97706" />

  <!-- Typography -->
  <text x="256" y="336" font-family="'Cairo', system-ui, sans-serif" font-size="34" font-weight="900" fill="#78350f" text-anchor="middle">أرض الذهب</text>
  <text x="256" y="374" font-family="'Cairo', system-ui, sans-serif" font-size="20" font-weight="700" fill="#b45309" text-anchor="middle">للمصوغات والمجوهرات والسبائك</text>
  <rect x="216" y="390" width="80" height="3" rx="1.5" fill="#f59e0b" />
  <text x="256" y="420" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="900" letter-spacing="3" fill="#92400e" text-anchor="middle">LAND OF GOLD JEWELRY</text>
  <text x="256" y="442" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5" fill="#94a3b8" text-anchor="middle">A MEMBER OF MRG GROUP</text>
</svg>